services:
  bepusdt:
    build:
      context: .
      dockerfile: dockerfile
    image: aboutnb/bepusdt:local
    container_name: bepusdt-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BEPUSDT_PORT:-18080}:8080"
    environment:
      LISTEN: 0.0.0.0:8080
      LOG: /var/log/bepusdt/
      SQLITE: /var/lib/bepusdt/sqlite.db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/var/lib/bepusdt
      - ./logs:/var/log/bepusdt
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
