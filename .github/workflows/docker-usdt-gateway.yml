name: docker-usdt-gateway

on:
  push:
    branches:
      - codex/usdt-amount-rate-alignment
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aboutnb/bepusdt

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=usdt-gateway-${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:usdt-gateway
            ${{ env.IMAGE }}:usdt-gateway-${{ github.sha }}
